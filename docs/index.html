<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header>
    <h1>Expense Tracker</h1>
    <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
  </header>

  <section class="balance-card">
    <span>Total Balance</span>
    <h2>₹ <span id="balance">0</span></h2>
  </section>

  <section class="add-card">
    <select id="type">
      <option value="income">Income</option>
      <option value="expense">Expense</option>
    </select>

    <select id="category"></select>

    <input id="title" placeholder="Description">
    <input id="amount" type="number" placeholder="Amount">

    <button class="primary" onclick="addTransaction()">Add Transaction</button>
  </section>

  <section class="summary">
    <div>
      <small>Income</small>
      <strong>₹ <span id="monthIncome">0</span></strong>
    </div>
    <div>
      <small>Expense</small>
      <strong>₹ <span id="monthExpense">0</span></strong>
    </div>
  </section>

  <ul id="transactionList"></ul>

</div>

<!-- SETTINGS MODAL -->
<div id="settingsModal" class="modal hidden">
  <div class="modal-content">
    <h3>Manage Expense Categories</h3>

    <input id="newCategory" placeholder="Category name">
    <input id="newIcon" placeholder="Icon (🛒 ⚡ 💳)">
    <button onclick="addCategory()">Add</button>

    <ul id="categoryList"></ul>

    <button class="close" onclick="toggleSettings()">Close</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
