<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Expense Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header>
    <h1>💰 Smart Expense Manager</h1>
    <div class="balance">
      <span>Balance</span>
      <h2>₹ <span id="balance">0</span></h2>
    </div>
  </header>

  <section class="card">
    <select id="type">
      <option value="income">Income</option>
      <option value="expense">Expense</option>
    </select>

    <select id="category"></select>

    <input id="title" placeholder="Description">
    <input id="amount" type="number" placeholder="Amount">

    <button onclick="addTransaction()">➕ Add</button>
  </section>

  <section class="summary">
    <div class="summary-card income">
      <p>Income</p>
      <h3>₹ <span id="monthIncome">0</span></h3>
    </div>
    <div class="summary-card expense">
      <p>Expense</p>
      <h3>₹ <span id="monthExpense">0</span></h3>
    </div>
  </section>

  <section class="card">
    <h3>🧾 Transactions</h3>
    <ul id="transactionList"></ul>
  </section>

  <section class="card">
    <h3>⚙️ Manage Expense Categories</h3>
    <input id="newCategory" placeholder="Category name">
    <input id="newIcon" placeholder="Icon (🛒 ⚡ 💳)">
    <button onclick="addCategory()">Add Category</button>
    <ul id="categoryList"></ul>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
